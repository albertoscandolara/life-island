name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      GROCERY_DATABASE_URL: postgres://grocery_svc:dev_grocery@localhost:5432/life_island
      NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sets NX_BASE and NX_HEAD so `nx affected` compares against the last green main.
      - uses: nrwl/nx-set-shas@v4

      - name: Start infrastructure
        run: npm run infra:up

      - name: Check each service role sees only its own schema
        run: npm run db:check-isolation

      - name: Check gateway
        run: curl --fail --silent http://localhost:8080/healthz

      - run: npx nx format:check
      - run: npx nx sync:check
      - run: npx nx affected -t lint test build typecheck

      - name: Stop infrastructure
        if: always()
        run: npm run infra:down
