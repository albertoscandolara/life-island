<!-- Backdrop clicks close the dialog; the keyboard equivalent is Escape (the cancel event). -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialog
  class="ui-dialog"
  [class]="'ui-dialog--' + size()"
  [attr.aria-labelledby]="heading() ? headingId : null"
  (cancel)="onCancel($event)"
  (click)="onClick($event)"
>
  @if (open()) {
  <div class="ui-dialog__panel">
    <header class="ui-dialog__header">
      <h2 class="ui-dialog__heading" [id]="headingId">{{ heading() }}</h2>
      @if (dismissible()) {
      <button
        uiButton
        variant="ghost"
        size="sm"
        [iconOnly]="true"
        type="button"
        aria-label="Close"
        (click)="close()"
      >
        <ui-icon name="x" [size]="18" />
      </button>
      }
    </header>
    <div class="ui-dialog__body">
      <ng-content />
    </div>
    <footer class="ui-dialog__footer">
      <ng-content select="[uiDialogFooter]" />
    </footer>
  </div>
  }
</dialog>
