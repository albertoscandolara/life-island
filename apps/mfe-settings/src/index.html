<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings · Life Island</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap"
    />
    <script>
      // Apply the saved (or system) theme before the first paint, so the page
      // never flashes the wrong one. UiThemeService takes over once Angular starts.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('life-island.theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <settings-root></settings-root>
  </body>
</html>
