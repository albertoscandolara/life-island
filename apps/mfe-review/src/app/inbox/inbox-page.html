<ui-page-header
  heading="Review inbox"
  subtitle="Ptera keeps everything you uploaded. Open a parsed record to check what was read, then confirm it."
  emblem="🦅"
>
  <button
    uiPageActions
    uiButton
    variant="secondary"
    type="button"
    [loading]="records.isLoading()"
    (click)="records.reload()"
  >
    <ui-icon name="refresh" [size]="18" /> Refresh
  </button>
</ui-page-header>

<form class="filters" role="search" (submit)="$event.preventDefault()">
  <ui-form-field label="Search" class="filters__search">
    <input
      uiInput
      type="search"
      placeholder="Title or description"
      [value]="searchText()"
      (input)="searchText.set(inputValue($event))"
    />
  </ui-form-field>
  <ui-form-field label="Status">
    <ui-dropdown
      [options]="statusOptions"
      [(value)]="status"
      [clearable]="true"
      clearLabel="Any status"
      placeholder="Any status"
      aria-label="Status"
    />
  </ui-form-field>
  <ui-form-field label="Category">
    <ui-dropdown
      [options]="categoryOptions"
      [(value)]="category"
      [clearable]="true"
      clearLabel="Any category"
      placeholder="Any category"
      aria-label="Category"
    />
  </ui-form-field>
  <ui-form-field label="Format">
    <ui-dropdown
      [options]="formatOptions"
      [(value)]="fileFormat"
      [clearable]="true"
      clearLabel="Any format"
      placeholder="Any format"
      aria-label="Format"
    />
  </ui-form-field>
  <ui-form-field label="Uploaded from">
    <input
      uiInput
      type="date"
      [value]="uploadedFrom()"
      [max]="uploadedTo() || null"
      (change)="uploadedFrom.set(inputValue($event))"
    />
  </ui-form-field>
  <ui-form-field label="Uploaded to">
    <input
      uiInput
      type="date"
      [value]="uploadedTo()"
      [min]="uploadedFrom() || null"
      (change)="uploadedTo.set(inputValue($event))"
    />
  </ui-form-field>
  <div class="filters__actions">
    <button
      uiButton
      variant="ghost"
      type="button"
      [disabled]="!hasFilters()"
      (click)="clearFilters()"
    >
      <ui-icon name="x" [size]="16" /> Clear filters
    </button>
  </div>
</form>

@if (records.error()) {
<ui-alert tone="danger" class="error"
  >The records could not be loaded. Is the review service running?</ui-alert
>
}

<ui-table
  [columns]="columns"
  [rows]="rows()"
  [loading]="records.isLoading()"
  [(sort)]="sort"
  [(page)]="page"
  [pageSize]="pageSize"
  [total]="total()"
  caption="Uploaded documents"
  [emptyMessage]="hasFilters() ? 'No records match these filters.' : 'Nothing uploaded yet.'"
>
  <ng-template uiCell="title" [uiCellOf]="rows()" let-row>
    <span class="title">{{ row.title }}</span>
  </ng-template>
  <ng-template uiCell="description" [uiCellOf]="rows()" let-row>
    <span class="description">{{ row.description ?? '–' }}</span>
  </ng-template>
  <ng-template uiCell="status" [uiCellOf]="rows()" let-row>
    <ui-status-dot
      [tone]="statusView[row.status].tone"
      [label]="statusView[row.status].label"
      [pulse]="!!statusView[row.status].pulse"
    />
  </ng-template>
  <ng-template uiCell="uploadedAt" [uiCellOf]="rows()" let-row>
    {{ row.uploadedAt | date: 'dd MMM yyyy, HH:mm' }}
  </ng-template>
  <ng-template uiCell="parsedAt" [uiCellOf]="rows()" let-row>
    {{ row.parsedAt ? (row.parsedAt | date: 'dd MMM yyyy, HH:mm') : '–' }}
  </ng-template>
  <ng-template uiCell="details" [uiCellOf]="rows()" let-row>
    @if (hasDetails(row)) {
    <button
      uiButton
      variant="ghost"
      size="sm"
      [iconOnly]="true"
      type="button"
      [attr.aria-label]="'Show details of ' + row.title"
      (click)="openDetails(row)"
    >
      <ui-icon name="eye" [size]="18" />
    </button>
    }
  </ng-template>
</ui-table>

<app-record-dialog
  [recordId]="selectedId()"
  [(open)]="dialogOpen"
  (confirmedRecord)="records.reload()"
/>
