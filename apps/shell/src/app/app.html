<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/">
      <span class="brand__mark ui-token ui-token--sm" aria-hidden="true"
        >🏝️</span
      >
      <span class="brand__name">Life Island</span>
    </a>
    <div class="topbar__end">
      @if (auth.session()?.ready && auth.user(); as user) {
      <a class="topbar__link" [href]="documentsUrl">
        <ui-icon name="upload" [size]="18" />
        <span class="topbar__label">Documents</span>
      </a>
      <a
        class="topbar__link"
        routerLink="/companies"
        routerLinkActive="topbar__link--on"
        ariaCurrentWhenActive="page"
      >
        <ui-icon name="layers" [size]="18" />
        <span class="topbar__label">Companies</span>
      </a>
      <a class="topbar__link" routerLink="/settings">
        <ui-icon name="sliders" [size]="18" />
        <span class="topbar__label">Settings</span>
      </a>
      <a
        class="topbar__link"
        routerLink="/account"
        routerLinkActive="topbar__link--on"
        ariaCurrentWhenActive="page"
      >
        <ui-icon name="user" [size]="18" />
        <span class="topbar__label">{{ user.name }}</span>
      </a>
      }
      <ui-theme-toggle />
    </div>
  </div>
</header>
<main class="page"><router-outlet /></main>
