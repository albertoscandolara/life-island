<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/">
      <span class="brand__mark" aria-hidden="true">🏝️</span>
      <span class="brand__name">Life Island</span>
    </a>
    <div class="topbar__end">
      <a class="topbar__link" [href]="documentsUrl">
        <ui-icon name="upload" [size]="18" /> Documents
      </a>
      <a class="topbar__link" routerLink="/settings">
        <ui-icon name="sliders" [size]="18" /> Settings
      </a>
      <ui-theme-toggle />
    </div>
  </div>
</header>
<main class="page"><router-outlet /></main>
