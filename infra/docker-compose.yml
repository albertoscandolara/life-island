name: life-island

# Paths are relative to the repository root. Run it through the npm scripts
# (`npm run infra:up`), which pass `--project-directory .` so the root .env is read.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: life_island
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Only 01 and 02 run at init; 03 is the isolation check, run on demand.
      - ./infra/postgres/init/01-schemas-and-roles.sql:/docker-entrypoint-initdb.d/01-schemas-and-roles.sql:ro
      - ./infra/postgres/init/02-outbox.sql:/docker-entrypoint-initdb.d/02-outbox.sql:ro
      - ./infra/postgres/init/03-check-isolation.sql:/checks/03-check-isolation.sql:ro
      # Idempotent upgrades for a volume created before a schema existed. npm run db:upgrade
      # pipes them to psql, so this mount is only for running one by hand.
      - ./infra/postgres/upgrades:/upgrades:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d life_island']
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    ports:
      - '${STORAGE_S3_PORT:-8333}:8333'
    volumes:
      - storage-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # The S3 gateway answers /healthz only once its filer is reachable. It listens on IPv4
      # only, and CI runners map localhost to ::1, so the address is explicit.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.11-alpine
    command: -js -sd /data -m 8222
    ports:
      - '${NATS_PORT:-4222}:4222'
      - '${NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          'http://localhost:8222/healthz?js-enabled-only=true',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    image: caddy:2.10-alpine
    ports:
      - '${GATEWAY_PORT:-8080}:80'
    environment:
      # Sign-in for everything behind the gateway: `basic` turns it on (set
      # GATEWAY_USER and GATEWAY_PASSWORD_HASH, see infra/caddy/README.md);
      # `off` is for local development only.
      GATEWAY_AUTH: ${GATEWAY_AUTH:-off}
      GATEWAY_USER: ${GATEWAY_USER:-}
      GATEWAY_PASSWORD_HASH: ${GATEWAY_PASSWORD_HASH:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/auth:/etc/caddy/auth:ro

  # The services themselves, for running the stack without Node installed:
  # `docker compose --project-directory . -f infra/docker-compose.yml --profile apps up -d --build`.
  # During development run them with `npx nx serve <service>` instead.
  svc-ingestion:
    profiles: [apps]
    build: &service-build
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: svc-ingestion }
    environment: &service-env
      PORT: 3000
      INGESTION_DATABASE_URL: postgres://ingestion_svc:dev_ingestion@postgres:5432/life_island
      REVIEW_DATABASE_URL: postgres://review_svc:dev_review@postgres:5432/life_island
      GROCERY_DATABASE_URL: postgres://grocery_svc:dev_grocery@postgres:5432/life_island
      TAX730_DATABASE_URL: postgres://tax730_svc:dev_tax730@postgres:5432/life_island
      HOME_DATABASE_URL: postgres://home_svc:dev_home@postgres:5432/life_island
      PEOPLE_DATABASE_URL: postgres://people_svc:dev_people@postgres:5432/life_island
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://storage:8333
      # Presigned URLs are opened by the browser, so they must name a host it can reach.
      S3_PUBLIC_ENDPOINT: http://localhost:${STORAGE_S3_PORT:-8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dev_access_key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev_secret_key}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      STORAGE_CORS_ORIGINS: ${STORAGE_CORS_ORIGINS:-http://localhost:8080}
    depends_on: &service-deps
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      storage: { condition: service_started }

  svc-parse-worker:
    profiles: [apps]
    # svc-ingestion owns the schema; retry until its migrations have run.
    restart: on-failure
    build:
      <<: *service-build
      args: { SERVICE: svc-parse-worker }
    environment:
      <<: *service-env
      PARSE_SCHEDULE: ${PARSE_SCHEDULE:-06:00}
      PARSE_TIMEZONE: ${PARSE_TIMEZONE:-Europe/Rome}
      PARSE_RUN_ON_START: ${PARSE_RUN_ON_START:-false}
      PARSE_QUOTA_RETRY_MINUTES: ${PARSE_QUOTA_RETRY_MINUTES:-360}
      PARSE_QUOTA_RETRY_MAX_MINUTES: ${PARSE_QUOTA_RETRY_MAX_MINUTES:-1440}
      CATEGORY_AUTO_APPROVE: ${CATEGORY_AUTO_APPROVE:-false}
      RECLASSIFY_SCHEDULE: ${RECLASSIFY_SCHEDULE:-0 3 1 * *}
      RECLASSIFY_TIMEZONE: ${RECLASSIFY_TIMEZONE:-Europe/Rome}
      RECLASSIFY_BATCH_SIZE: ${RECLASSIFY_BATCH_SIZE:-50}
      RECLASSIFY_LEASE_MINUTES: ${RECLASSIFY_LEASE_MINUTES:-5}
      PARSER: ${PARSER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      <<: *service-deps
      svc-ingestion: { condition: service_started }

  svc-review:
    profiles: [apps]
    build:
      <<: *service-build
      args: { SERVICE: svc-review }
    environment:
      <<: *service-env
      # Review writes pause while svc-ingestion runs a historical reclassification.
      INGESTION_URL: http://svc-ingestion:3000
    depends_on: *service-deps

  # Domain modules: each loads the confirmed records of its own targets.
  svc-groceries:
    profiles: [apps]
    build:
      <<: *service-build
      args: { SERVICE: svc-groceries }
    environment: *service-env
    depends_on: *service-deps

  svc-tax730:
    profiles: [apps]
    build:
      <<: *service-build
      args: { SERVICE: svc-tax730 }
    environment:
      <<: *service-env
      # The commercialista's zip reads the original files through svc-ingestion's API.
      INGESTION_URL: http://svc-ingestion:3000
    depends_on: *service-deps

  svc-home:
    profiles: [apps]
    build:
      <<: *service-build
      args: { SERVICE: svc-home }
    environment:
      <<: *service-env
      # Previews of bills and work invoices are streamed from svc-ingestion's API.
      INGESTION_URL: http://svc-ingestion:3000
    depends_on: *service-deps

  svc-people:
    profiles: [apps]
    build:
      <<: *service-build
      args: { SERVICE: svc-people }
    environment:
      <<: *service-env
      # Previews of ID documents are streamed from svc-ingestion's API.
      INGESTION_URL: http://svc-ingestion:3000
    depends_on: *service-deps

volumes:
  postgres-data:
  storage-data:
  nats-data:
